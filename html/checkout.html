<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout page</title>
    <link rel="stylesheet" href="../css/checkout.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="checkout-nav">
      <a href="e-commerce.html">
        <div class="logo">
          <h1>Shop<span>Mate</span></h1>
        </div>
      </a>
      <div class="checkout-div">
        <h2>Checkout</h2>
        <span class="checkout-count">(0)</span>
      </div>
    </div>
    <div class="checkout-container">
      <form class="customer-form" id="customer-form">
        <h3>Customer Information</h3>

        <div class="input">
          <label for="first-name">First Name</label>
          <input type="text" id="first-name" />
        </div>

        <div class="input">
          <label for="last-name">Last Name</label>
          <input type="text" id="last-name" />
        </div>

        <div class="input">
          <label for="phone-number">Phone</label>
          <input type="tel" id="phone-number" />
        </div>

        <div class="input">
          <label for="email">Email</label>
          <input type="email" id="email" />
        </div>

        <div class="input">
          <label for="delivery-address">Delivery Address</label>
          <input type="text" id="delivery-address" />
        </div>
      </form>

      <div class="summary-container">
        <h3>Order Summary</h3>
        <div class="order-summary">
          <div class="checkout-item"></div>

          <div class="subtotal">
            <span>Subtotal</span>
            <span class="subtotal-value">$0</span>
          </div>

          <div class="Delivery">
            <span>Delivery</span>
            <span class="delivery-value">$0</span>
          </div>

          <div class="total">
            <span>Total</span>
            <span class="total-value">$0</span>
          </div>

          <button type="submit" class="order-btn" form="customer-form">
            Place Your Order
          </button>
        </div>
      </div>
    </div>
    <div class="order-confirmation">
      <h2>Order Placed Successfully!</h2>
      <p>Thank you <span class="customer-name"></span>!</p>
      <p>Order ID: <span class="order-id"></span></p>

      <div class="confirmed-products"></div>
      <p>Total: $<span class="confirmed-total"></span></p>
    </div>
    <script src="../js/checkout.js"></script>
  </body>
</html>
